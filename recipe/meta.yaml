{% set name = "fscacher" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 414afda5a98bb4f84a1c8e159d0cee3db254139cd832eec2dd74fa5124e92d14

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - joblib
    - platformdirs

test:
  requires:
    - pytest
    - pytest-mock
    - python {{ python_min }}
  imports:
    - fscacher
    - fscacher.tests
  commands:
    - python -m pytest -vv --pyargs fscacher

about:
  home: https://github.com/con/fscacher
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Caching results of operations on heavy file trees
  description: |
    fscacher provides a cache & decorator for memoizing functions whose outputs
    depend upon the contents of a file argument.
  dev_url: https://github.com/con/fscacher
  doc_url: https://pypi.org/project/fscacher/

extra:
  recipe-maintainers:
    - yarikoptic
